# Jaguar Radiadores - EasyPanel/Nixpacks
# TanStack Start is an SSR/server application.
# Bun 1.3.0 (seen in EasyPanel/Nixpacks) wants to refresh the inherited lockfile,
# so the install phase intentionally does NOT use --frozen-lockfile.

[phases.install]
cmds = ["bun install"]

[phases.build]
cmds = ["bun run build"]

[start]
cmd = "node .output/server/index.mjs"
